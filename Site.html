<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Airport Route Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>World Airport Route Calculator</h1>

  <label for="origin">Origin (IATA/ICAO):</label>
  <input type="text" id="origin" placeholder="e.g. HND">

  <label for="destination">Destination (IATA/ICAO):</label>
  <input type="text" id="destination" placeholder="e.g. LHR">

  <label>
    <input type="checkbox" id="stopover"> Include Stopover
  </label>

  <button id="calculate">Calculate Route</button>

  <div id="map" style="height:500px;"></div>
  <div id="results"></div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="main.js"></script>
</body>
</html>
