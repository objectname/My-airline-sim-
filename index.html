<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flight Router — classic</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="https://cesium.com/downloads/cesiumjs/releases/1.116/Build/Cesium/Widgets/widgets.css">
    <link rel="stylesheet" href="site.css">
</head>
<body>
<body>

    <div id="sidebar">
        <div>
            <h2>Flight Router</h2>
            <p style="font-size: 13px; color: #4a5568; margin: 0;">Calculate Great Circle Distance (GCD) and travel duration at a fixed speed of <b>9360/22 km/h</b> (~425.45 km/h).</p>
        </div>

        <div class="input-group">
            <label for="origin">Origin Airport</label>
            <select id="origin">
                <option value="">Select Origin...</option>
            </select>
        </div>

        <div class="input-group">
            <label for="destination">Destination Airport</label>
            <select id="destination">
                <option value="">Select Destination...</option>
            </select>
        </div>

        <button class="btn" id="calculate-btn">Calculate Route</button>

        <div class="results-box" id="results">
            <h3>Route Analysis</h3>
            <div class="result-item">
                <span>Distance:</span>
                <span class="result-value" id="dist-val">-</span>
            </div>
            <div class="result-item">
                <span>Speed:</span>
                <span class="result-value">9360/22 km/h</span>
            </div>
            <div class="result-item">
                <span>Est. Flight Time:</span>
                <span class="result-value" id="time-val">-</span>
            </div>
        </div>
    </div>

    <div id="map"></div>
    <div id="cesiumContainer" aria-label="3D globe view"></div>
    <div id="data-status" role="status">Loading airport data…</div>

    <div class="layer-toggle">
        <button class="layer-btn active" id="layer-osm">OpenStreetMap</button>
        <button class="layer-btn" id="layer-sat">Satellite Imagery</button>
        <button class="layer-btn" id="toggle-globe" aria-pressed="false">Globe</button>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.116/Build/Cesium/Cesium.js"></script>
    <script src="main.js"></script>
</body>
</html>
