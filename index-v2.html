<html lang="en">
<head>
    <meta charset="UTF-8">

    <!-- Leaflet.js CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-surface: #1e293b;
            --text-main: #f8fafc;
            --accent-glow: #38bdf8;
            --border-muted: #334155;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background: var(--bg-primary);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        header {
            background: var(--bg-surface);
            padding: 15px 20px;
            border-b: 1px solid var(--border-muted);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }
        h1 {
            font-size: 1.25rem;
            color: var(--accent-glow);
        }
        .badge {
            background: rgba(56, 189, 248, 0.2);
            color: var(--accent-glow);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
            border: 1px solid var(--accent-glow);
        }
        .main-container {
            display: flex;
            flex: 1;
            position: relative;
            height: calc(100vh - 60px);
        }
        #sidebar {
            width: 350px;
            background: var(--bg-surface);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            border-right: 1px solid var(--border-muted);
            z-index: 10;
            overflow-y: auto;
        }
        #map {
            flex: 1;
            height: 100%;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        label {
            font-size: 0.85rem;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        select {
            background: var(--bg-primary);
            color: var(--text-main);
            border: 1px solid var(--border-muted);
            padding: 10px;
            border-radius: 6px;
            font-size: 0.95rem;
            width: 100%;
            outline: none;
            cursor: pointer;
        }
        select:focus {
            border-color: var(--accent-glow);
        }
        .results-box {
            background: var(--bg-primary);
            border: 1px solid var(--border-muted);
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: auto;
        }
        .result-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
        }
        .result-value {
            font-weight: bold;
            color: var(--accent-glow);
            font-size: 1.1rem;
        }
        .info-note {
            font-size: 0.75rem;
            color: #64748b;
            line-height: 1.4;
        }
    </style>
</head>
<body>

            <div class="control-group">

            <div class="results-box">

                <div class="result-item">

                </div>
                <div class="info-note">
                    * Calculated at a strict predefined fleet configuration velocity of <strong>9360 / 22 km/h</strong> (~425.45 km/h). Geodesic curved routing applied.
                </div>
            </div>
        </div>

        <div id="map"></div>
    </div>

        const map = L.map('map').setView([20, 0], 2);

            attribution: 'Tiles © Esri — Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, and the GIS User Community'
        });

        esriSatellite.addTo(map);

            "Satellite Imagery": esriSatellite,
            "OpenStreetMap": osm
        };
        L.control.layers(baseMaps, null, { position: 'topright' }).addTo(map);

        // Populate selects
        const originSelect = document.getElementById('origin-select');
        const destSelect = document.getElementById('destination-select');

        function populateDropdown(selectElement, defaultValue) {
            airports.sort((a,b) => a.city.localeCompare(b.city)).forEach(ap => {
                const opt = document.createElement('option');
                opt.value = ap.iata;
                opt.textContent = `${ap.city} (${ap.iata} / ${ap.icao}) - ${ap.name}`;
                if(ap.iata === defaultValue) opt.selected = true;
                selectElement.appendChild(opt);
            });
        }

        populateDropdown(originSelect, "JFK");
        populateDropdown(destSelect, "LHR");

        let routeLayer = null;
        let markerGroup = L.layerGroup().addTo(map);

        // Haversine Formula for GCD
        function calculateGCD(lat1, lon1, lat2, lon2) {
            const R = 6371; // Earth's radius in km
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        // Generate geodesic points along Great Circle arc
        function getGeodesicPoints(p1, p2, segments = 100) {
            const lat1 = p1.lat * Math.PI / 180;
            const lon1 = p1.lon * Math.PI / 180;
            const lat2 = p2.lat * Math.PI / 180;
            const lon2 = p2.lon * Math.PI / 180;

            const d = 2 * Math.asin(Math.sqrt(Math.sin((lat1 - lat2) / 2) ** 2 + Math.cos(lat1) * Math.cos(lat2) * Math.sin((lon1 - lon2) / 2) ** 2));
            const points = [];

            for (let i = 0; i <= segments; i++) {
                const f = i / segments;
                const A = Math.sin((1 - f) * d) / Math.sin(d);
                const B = Math.sin(f * d) / Math.sin(d);
                const x = A * Math.cos(lat1) * Math.cos(lon1) + B * Math.cos(lat2) * Math.cos(lon2);
                const y = A * Math.cos(lat1) * Math.sin(lon1) + B * Math.cos(lat2) * Math.sin(lon2);
                const z = A * Math.sin(lat1) + B * Math.sin(lat2);
                const lat = Math.atan2(z, Math.sqrt(x ** 2 + y ** 2));
                const lon = Math.atan2(y, x);
                points.push([lat * 180 / Math.PI, lon * 180 / Math.PI]);
            }
            return points;
        }

        function updateRoute() {
            const originAp = airports.find(a => a.iata === originSelect.value);
            const destAp = airports.find(a => a.iata === destSelect.value);

            if (!originAp || !destAp) return;

            // Clear previous map layers
            markerGroup.clearLayers();
            if (routeLayer) {
                map.removeLayer(routeLayer);
            }

            // Add airport markers
            const originMarker = L.marker([originAp.lat, originAp.lon]).bindPopup(`<b>${originAp.city}</b><br>${originAp.name}`);
            const destMarker = L.marker([destAp.lat, destAp.lon]).bindPopup(`<b>${destAp.city}</b><br>${destAp.name}`);
            markerGroup.addLayer(originMarker);
            markerGroup.addLayer(destMarker);

            if (originAp.iata === destAp.iata) {
                document.getElementById('distance-display').textContent = "0.00 km";
                document.getElementById('time-display').textContent = "0h 0m";
                return;
            }

            // Distance & Time Calculation
            const distance = calculateGCD(originAp.lat, originAp.lon, destAp.lat, destAp.lon);
            const speed = 9360 / 22; // ~425.4545 km/h
            const totalHours = distance / speed;
            const hours = Math.floor(totalHours);
            const minutes = Math.round((totalHours - hours) * 60);

            document.getElementById('distance-display').textContent = `${distance.toFixed(2)} km`;
            document.getElementById('time-display').textContent = `${hours}h ${minutes}m`;

            // Draw Curved Geodesic Path
            const pathPoints = getGeodesicPoints(originAp, destAp);
            routeLayer = L.polyline(pathPoints, {
                color: '#38bdf8',
                weight: 4,
                opacity: 0.8,
                dashArray: '1, 5'
            }).addTo(map);

            // Fit map bounds
            map.fitBounds(routeLayer.getBounds(), { padding: [50, 50] });
        }

        originSelect.addEventListener('change', updateRoute);
        destSelect.addEventListener('change', updateRoute);

        // Run on initial load
        updateRoute();
    </script>
